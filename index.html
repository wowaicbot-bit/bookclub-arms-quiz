<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팔은 거짓말을 못 한다 · 실루엣 퀴즈</title>
<style>
  :root{
    --bg:#F6F3EC; --ink:#2E2A3B; --muted:#7A7490;
    --accent:#5B4B9E; --accent-soft:#EDE9F7;
    --card:#FFFDF8; --line:#E2DCD0;
    --good:#2F7D5A; --good-soft:#E4F2EA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line);
  }
  .brand{font-weight:800; letter-spacing:-.02em; font-size:17px}
  .brand span{color:var(--accent)}
  .meta{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted)}
  .bar{width:160px; height:6px; background:var(--line); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .35s ease}
  .btn{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:7px 14px; border-radius:99px; transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.solid{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.solid:hover{opacity:.88; color:#fff}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:28px 32px}
  .stage{width:100%; max-width:1080px}
  .tag{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em;
    color:var(--accent); background:var(--accent-soft);
    padding:5px 11px; border-radius:99px; margin-bottom:14px;
  }
  h1{font-size:clamp(22px,3.2vw,34px); letter-spacing:-.03em; line-height:1.28; margin-bottom:8px}
  .sub{color:var(--muted); font-size:15px; margin-bottom:22px; line-height:1.6}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .opts.trio{grid-template-columns:1fr 1fr 1fr}
  .opt{
    background:var(--card); border:2px solid var(--line); border-radius:18px;
    padding:16px 16px 14px; cursor:pointer; transition:.18s; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .opt:hover{border-color:var(--accent); transform:translateY(-2px)}
  .opt .lbl{font-size:14px; font-weight:700; color:var(--muted)}
  .opt .cap{font-size:13px; color:var(--muted); text-align:center; line-height:1.5; min-height:2.6em}
  .opt svg{width:100%; height:auto; max-height:230px}
  .opt.picked{border-color:var(--accent); background:var(--accent-soft)}
  .opt.right{border-color:var(--good); background:var(--good-soft)}
  .opt.right .lbl{color:var(--good)}
  .opt.wrong{opacity:.42}
  .opt .mark{
    position:absolute; top:10px; right:12px; font-size:19px; opacity:0; transition:.2s;
  }
  .opt.right .mark{opacity:1}
  .reveal{
    margin-top:20px; background:var(--card); border:1px solid var(--line);
    border-left:4px solid var(--accent); border-radius:12px;
    padding:18px 20px; display:none;
  }
  .reveal.on{display:block; animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .reveal h3{font-size:16px; margin-bottom:9px; letter-spacing:-.02em}
  .reveal p{font-size:14.5px; line-height:1.75; color:#4A4560}
  .reveal p + p{margin-top:9px}
  .reveal b{color:var(--ink)}
  .note{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--muted); line-height:1.7; display:none;
  }
  .note.on{display:block}
  .note strong{color:var(--accent)}
  footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 32px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted);
  }
  .keys b{
    display:inline-block; background:var(--card); border:1px solid var(--line);
    border-radius:5px; padding:1px 6px; font-size:11.5px; margin:0 1px;
  }
  .nav{display:flex; gap:8px}
  /* 표지 / 마무리 */
  .cover{text-align:center; padding:20px}
  .cover h1{font-size:clamp(28px,4.6vw,48px); margin-bottom:16px}
  .cover .sub{font-size:17px; max-width:620px; margin:0 auto 26px}
  .cover .row{display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin-bottom:28px}
  .cover svg{height:190px; width:auto}
  .wrap3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px; text-align:left}
  .card3{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px}
  .card3 .n{font-size:12px; font-weight:800; color:var(--accent); letter-spacing:.06em}
  .card3 h4{font-size:15.5px; margin:6px 0 7px; letter-spacing:-.02em}
  .card3 p{font-size:13.5px; line-height:1.65; color:var(--muted)}
  /* --- 방 / 실시간 투표 --- */
  .room{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted)}
  .code{
    font-weight:800; letter-spacing:.16em; color:var(--accent);
    background:var(--accent-soft); padding:5px 11px; border-radius:8px; font-size:14px;
  }
  .dot{width:7px; height:7px; border-radius:99px; background:#C9C3B6; display:inline-block}
  .dot.live{background:var(--good); box-shadow:0 0 0 3px var(--good-soft)}
  .tally{width:100%; margin-top:2px}
  .tallybar{height:8px; background:var(--line); border-radius:99px; overflow:hidden}
  .tallybar i{display:block; height:100%; width:0; background:var(--accent); transition:width .4s ease}
  .opt.right .tallybar i{background:var(--good)}
  .tallytxt{font-size:12px; color:var(--muted); margin-top:5px; font-weight:600}
  .opt.voted{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .entry{display:flex; flex-direction:column; gap:11px; max-width:330px; margin:0 auto}
  .entry input{
    font:inherit; font-size:15px; text-align:center; letter-spacing:.14em; text-transform:uppercase;
    padding:11px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
  }
  .entry .or{font-size:12.5px; color:var(--muted); margin-top:4px}
  .hint{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.6}
  .guestmsg{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-top:18px; font-size:14px; color:var(--muted); text-align:center;
  }
  @media(max-width:860px){
    .opts,.opts.trio{grid-template-columns:1fr}
    .wrap3{grid-template-columns:1fr}
    header,main,footer{padding-left:18px; padding-right:18px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">팔은 거짓말을 못 한다 <span>· 실루엣 퀴즈</span></div>
  <div class="meta">
    <span class="room" id="room" hidden><span class="dot" id="dot"></span>
      <span class="code" id="roomcode"></span><span id="peers"></span></span>
    <span id="count">표지</span>
    <div class="bar"><i id="prog"></i></div>
    <button class="btn" id="noteBtn">진행자 노트 N</button>
  </div>
</header>

<main><div class="stage" id="stage"></div></main>

<footer>
  <div class="keys">
    <b>←</b> <b>→</b> 이동 · <b>Space</b> 정답 공개 · <b>N</b> 진행자 노트
  </div>
  <div class="nav">
    <button class="btn" id="prev">이전</button>
    <button class="btn solid" id="next">다음</button>
  </div>
</footer>

<script>
/* ---------- 실루엣 렌더러 ---------- */
const INK = '#2E2A3B';

/* 팔은 어깨에서 시작하는 점 배열로 정의한다. */
const ARM = {
  victoryL:[[78,82],[50,54],[36,24]],      victoryR:[[122,82],[150,54],[164,24]],
  clutchL: [[78,82],[56,46],[86,22]],      clutchR: [[122,82],[144,46],[114,22]],
  sideL:   [[78,82],[70,124],[72,166]],    sideR:   [[122,82],[130,124],[128,166]],
  rigidL:  [[78,82],[75,124],[77,168]],    rigidR:  [[122,82],[125,124],[123,168]],
  crossL:  [[78,82],[60,114],[126,134]],   crossR:  [[122,82],[140,114],[74,142]],
  akimboL: [[78,82],[44,116],[84,140]],    akimboR: [[122,82],[156,116],[116,140]],
  behindL: [[78,82],[58,122],[94,152]],    behindR: [[122,82],[142,122],[106,152]],
  cobraL:  [[78,82],[42,58],[86,38]],      cobraR:  [[122,82],[158,58],[114,38]],
  splayL:  [[78,82],[38,128],[14,176]],    splayR:  [[122,82],[162,128],[186,176]],
  gatherL: [[78,82],[78,128],[96,170]],    gatherR: [[122,82],[122,128],[104,170]],
  drapeL:  [[78,82],[40,96],[20,80]],      drapeR:  [[122,82],[160,96],[180,80]],
  reachL:  [[78,82],[52,120],[26,150]],    reachR:  [[122,82],[152,124],[186,168]],
  restL:   [[78,82],[56,124],[78,172]],    restR:   [[122,82],[144,124],[122,172]],
  pullL:   [[78,82],[62,126],[92,166]],    pullR:   [[122,82],[138,126],[108,166]],
  browseL: [[78,82],[56,122],[90,146]],    browseR: [[122,82],[144,122],[110,146]],
  pressL:  [[78,82],[58,132],[94,172]],    pressR:  [[122,82],[142,132],[106,172]],
};

function pts(a){ return a.map(p=>p.join(',')).join(' '); }

function limb(p, w){
  return `<polyline points="${pts(p)}" fill="none" stroke="${INK}"
    stroke-width="${w||19}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function hand(p, r){
  const e = p[p.length-1];
  return `<circle cx="${e[0]}" cy="${e[1]}" r="${r||10}" fill="${INK}"/>`;
}

/*
  opts:
   l, r      : 팔 점배열
   behind    : true면 팔을 몸통 뒤에 그린다 (뒷짐)
   seated    : 다리 대신 테이블
   grip      : 손 끝을 크게(움켜쥠)
   book      : 손에 사각형 소품
   dim       : 흐리게
*/
function fig(o){
  o = o || {};
  const head  = `<circle cx="100" cy="34" r="23" fill="${INK}"/>`;
  const torso = `<rect x="74" y="64" width="52" height="${o.seated?118:108}" rx="24" fill="${INK}"/>`;
  const legs  = o.seated ? '' :
      limb([[86,166],[82,212],[84,252]],20) + limb([[114,166],[118,212],[116,252]],20);
  const table = (o.seated && !o.noTable) ?
      `<rect x="-6" y="184" width="212" height="13" rx="6" fill="${INK}" opacity=".3"/>` : '';

  /* 팔이 몸통 위를 지날 때 묻히지 않도록, 먼저 배경색으로 테두리를 깔고 그 위에 그린다 */
  let halo = '', arms = '';
  const HB = 'var(--card,#FFFDF8)';
  const haloOf = (p,r)=>
      `<polyline points="${pts(p)}" fill="none" stroke="${HB}" stroke-width="28"
         stroke-linecap="round" stroke-linejoin="round"/>` +
      `<circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="${r+4}" fill="${HB}"/>`;
  const R = o.grip ? 13 : 10;
  if(o.l){ halo += haloOf(o.l,R); arms += limb(o.l) + hand(o.l,R); }
  if(o.r){ halo += haloOf(o.r,R); arms += limb(o.r) + hand(o.r,R); }
  arms = halo + arms;

  let prop = '';
  if(o.book && o.l){
    const e = o.l[o.l.length-1];
    prop = `<rect x="${e[0]-19}" y="${e[1]-9}" width="34" height="24" rx="3"
      fill="none" stroke="${INK}" stroke-width="6"/>`;
  }

  const body = o.behind
      ? arms + torso + head + legs
      : torso + head + legs + arms;

  return `<svg viewBox="0 0 200 268" xmlns="http://www.w3.org/2000/svg"
    style="opacity:${o.dim?.32:1}">${table}${body}${prop}</svg>`;
}

/* 두 사람을 한 장면에 (테이블 마주앉기) */
function pair(a, b){
  const strip = o => fig(Object.assign({}, o, {noTable:true}))
                      .replace(/<svg[^>]*>|<\/svg>/g,'');
  const g = (o,dx,flip)=>`<g transform="translate(${dx},18) scale(${flip?-0.78:0.78},0.78)
    ${flip?'translate(-200,0)':''}">${strip(o)}</g>`;
  return `<svg viewBox="0 0 400 252" xmlns="http://www.w3.org/2000/svg">
    ${g(a,4,false)}${g(b,216,true)}
    <rect x="34" y="176" width="332" height="14" rx="7" fill="${INK}" opacity=".28"/>
    </svg>`;
}

/* ---------- 문항 ---------- */
const Q = [
{
  tag:'문제 1 · 열림과 닫힘',
  q:'두 선수 모두 팔이 위로 올라갔습니다. 경기에서 이긴 쪽은?',
  sub:'얼굴은 가렸습니다. 팔만 보고 고르세요.',
  opts:[
    {cap:'팔을 바깥으로 뻗었다', svg:fig({l:ARM.victoryL, r:ARM.victoryR})},
    {cap:'팔로 머리를 감쌌다',   svg:fig({l:ARM.clutchL,  r:ARM.clutchR})},
  ],
  ans:0,
  title:'기준은 높이가 아니라 — 열렸는가, 닫혔는가',
  why:`둘 다 <b>중력을 거슬러</b> 팔이 올라갔습니다. 그런데 방향이 정반대예요.
       이긴 쪽은 팔이 <b>바깥으로 열리며 몸이 커집니다.</b>
       실축한 쪽은 팔이 <b>안으로 모이며 몸이 작아집니다.</b>|
       머리 감싸기에는 두 가지가 겹쳐 있습니다.
       얼굴을 가리는 <b>시각 차단</b>("보고 싶지 않다"), 그리고 머리·목덜미를 만지는
       <b>진정 행동</b>(자기 위로)이죠. 패배 신호와 자기 위로를 동시에 하는 겁니다.`,
  note:`<strong>진행자</strong> 다들 "높이"를 볼 거예요. 답을 바로 말하지 말고
        "둘 다 팔이 올라갔는데요?" 하고 한 번 되물으세요. 거기서 <strong>부피</strong>라는
        답이 나오면 그 사람 칭찬하고 넘어가면 됩니다.`
},
{
  tag:'문제 2 · 영역 선언',
  q:'회의 테이블입니다. 이 자리의 책임자는 누구일까요?',
  sub:'',
  opts:[
    {cap:'팔을 테이블 위로 넓게 펼쳤다', svg:fig({seated:true, l:ARM.splayL, r:ARM.splayR})},
    {cap:'팔을 몸쪽으로 모았다',         svg:fig({seated:true, l:ARM.gatherL, r:ARM.gatherR})},
  ],
  ans:0,
  title:'팔은 영역을 표시하는 도구다',
  why:`지하철 팔걸이 쟁탈전, 테이블 차지하기 — 전부 같은 원리입니다.
       <b>차지한 면적이 곧 주장하는 지위</b>예요.|
       나바로는 몸을 뒤로 젖히고 팔을 벌려 깍지 끼는 자세를 <b>코브라</b>에 비유합니다.
       목을 늘여 실제보다 커 보이게 만드는 것과 같은 전략이죠.
       탑승권 발매 직원이 카운터 앞 승객의 <b>팔 벌림 정도</b>로 문제가 될 손님을
       미리 골라낸다는 얘기도 같은 맥락입니다.`,
  note:`<strong>진행자</strong> 여기서 버스·지하철 팔걸이 경험담을 꺼내세요.
        "저도 일부러 그럴 때 있다"고 먼저 고백하면 다들 따라서 털어놓습니다.
        웃음 나오는 구간이에요.`
},
{
  tag:'문제 3 · 함정',
  q:'두 사람 모두 손을 등 뒤로 두고 있습니다. 지위가 더 높은 쪽은?',
  sub:'신중하게 고르세요.',
  trio:true,
  opts:[
    {cap:'복도를 천천히 걷는 교수', svg:fig({behind:true, l:ARM.behindL, r:ARM.behindR})},
    {cap:'상관 앞에 선 신병',       svg:fig({behind:true, l:ARM.behindL, r:ARM.behindR})},
    {cap:'자세만으로는 알 수 없다', svg:`<svg viewBox="0 0 200 268"><text x="100" y="150"
       text-anchor="middle" font-size="86" font-weight="800" fill="#5B4B9E">?</text></svg>`},
  ],
  ans:2,
  title:'같은 자세, 정반대 의미 — 이 책이 놓친 지점',
  why:`나바로는 <b>뒷짐 = 왕의 자세</b>라고 씁니다. 대학교수·의사·영국 여왕이
       그렇게 걷는다고요. "가까이 오지 마라, 내 몸에 손대지 마라"는 뜻이라고 해석합니다.|
       그런데 한국에서 같은 자세는 <b>열중쉬어</b>이고, 혼날 때 손을 뒤로 하는 자세입니다.
       차이는 자세가 아니라 <b>누가 정했느냐</b>예요.
       내가 <b>선택</b>해서 뒷짐이면 지배이고, 남이 <b>시켜서</b> 뒷짐이면 복종입니다.|
       참고로 "뒷짐 = 지위"는 저자의 현장 관찰이지 검증된 연구가 아닙니다.
       이 책은 <b>FBI 경험칙과 검증된 연구가 섞여 있는데 구분해서 써주지 않아요.</b>`,
  note:`<strong>진행자</strong> 이 문제는 틀리라고 낸 겁니다. A나 B를 고른 사람이 많을수록 좋아요.
        정답 공개하고 "책이 여기서 한 발 모자랍니다" 하고 넘어가면,
        뒤에 나올 "책을 의심해보자" 파트가 자연스럽게 열립니다.`
},
{
  tag:'문제 4 · 팔짱의 진실',
  q:'둘 다 팔짱을 꼈습니다. 지금 불편한 쪽은?',
  sub:'차이는 아주 작습니다. 손끝을 보세요.',
  opts:[
    {cap:'손이 팔뚝을 꽉 움켜쥐었다', svg:fig({l:ARM.crossL, r:ARM.crossR, grip:true})},
    {cap:'팔을 느슨하게 얹었다',      svg:fig({l:ARM.crossL, r:ARM.crossR})},
  ],
  ans:0,
  title:'팔짱 = 방어, 는 틀렸다',
  why:`다들 "팔짱 끼면 방어적"이라고 알고 있지만, 나바로는 <b>자기 위로(self-hug)</b>일
       수 있다고 봅니다. 그냥 춥거나, 그 자세가 편해서일 수도 있고요.|
       구분은 <b>손가락</b>에서 납니다. 팔뚝을 움켜쥐고 있으면 억제·불편이고,
       느슨하게 얹혀 있으면 편안한 겁니다.
       <b>자세가 아니라 긴장도를 보세요.</b>`,
  note:`<strong>진행자</strong> "지금 팔짱 끼고 계신 분?" 하고 한번 둘러보세요.

/* ---------- 표지 / 마무리 ---------- */
const COVER = `<div class="cover">
  <div class="row">
    ${fig({l:ARM.victoryL, r:ARM.victoryR})}
    ${fig({l:ARM.clutchL,  r:ARM.clutchR})}
    ${fig({l:ARM.akimboL,  r:ARM.akimboR})}
  </div>
  <h1>팔은 거짓말을 못 한다</h1>
  <p class="sub">얼굴은 지웠습니다. 팔만 보고 여덟 번 판단해보세요.<br>
     『FBI 행동의 심리학』 · 팔 편</p>
  <div class="entry">
    <button class="btn solid" style="font-size:15px;padding:12px" onclick="hostRoom()">
      방 만들기 · 다 같이 투표</button>

  </div>
  <p class="hint">방을 만들면 참가자 화면이 진행자를 따라 움직이고,<br>
     각자 고른 답이 실시간으로 집계됩니다.</p>
</div>`;

const OUTRO = `<div class="cover">
  <div class="tag">정리</div>
  <h1 style="font-size:clamp(24px,3.6vw,38px)">오늘 가져갈 세 가지</h1>
  <div class="wrap3">
    <div class="card3"><div class="n">01</div>
      <h4>높이가 아니라 부피</h4>
      <p>팔이 바깥으로 열리면 기쁨, 안으로 모이면 괴로움.
         올라갔다고 다 좋은 게 아닙니다.</p></div>
    <div class="card3"><div class="n">02</div>
      <h4>자세가 아니라 변화</h4>
      <p>평소 상태를 봐두고, 언제 바뀌는지 보고,
         그 직전 질문을 의심하세요. 이게 이 책의 사용법입니다.</p></div>

      <h4>맥락이 의미를 정한다</h4>
      <p>같은 뒷짐도 선택이면 지배, 강요면 복종.
         책의 결론을 그대로 외우면 틀립니다.</p></div>
  </div>
  <p class="sub" style="margin-top:26px">
    이번 주 숙제 — <b>회의실에서 내 팔이 누구 쪽으로 가 있는지</b> 한 번만 보기.</p>
</div>`;

/* ---------- 실시간 (서버 없이 공개 MQTT 브로커 경유) ---------- */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];
const AB = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd = n => Array.from({length:n}, ()=>AB[Math.random()*AB.length|0]).join('');

let mode='solo', room=null, cli=null, me=rnd(8);
let votes={}, peers=new Set(), myPick=null;

const T = s => `bcarms/${room}/${s}`;

function loadMqtt(){
  if(window.mqtt) return Promise.resolve();
  return new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js';
    s.onload=ok; s.onerror=()=>no(new Error('mqtt load fail'));
    document.head.appendChild(s);
  });
}

async function connect(code, asHost){
  await loadMqtt();
  room = code; mode = asHost ? 'host' : 'guest';
  document.getElementById('room').hidden = false;
  document.getElementById('roomcode').textContent = code;
  setDot(false);

  for(const url of BROKERS){
    try{
      cli = await new Promise((ok,no)=>{
        const c = mqtt.connect(url, {clientId:'bc_'+me, connectTimeout:6000, reconnectPeriod:0});
        c.on('connect', ()=>ok(c));
        c.on('error', e=>{ try{c.end(true)}catch{} no(e); });
        setTimeout(()=>{ try{c.end(true)}catch{} ; no(new Error('timeout')); }, 7000);
      });
      break;
    }catch(e){ cli=null; }
  }
  if(!cli){
    alert('실시간 연결에 실패했습니다. 혼자 진행 모드로 넘어갑니다.');
    mode='solo'; document.getElementById('room').hidden = true; go(1); return;
  }
  setDot(true);
  cli.on('message', (t,p)=>{
    let m; try{ m = JSON.parse(p.toString()); }catch{ return; }
    const leaf = t.split('/').pop();
    if(leaf==='state' && mode==='guest'){
      i = m.i; render(); if(m.shown) reveal(true);
    } else if(leaf==='vote'){
      (votes[m.i] ||= {})[m.who] = m.pick;
      peers.add(m.who); paintPeers(); paintTally();
    } else if(leaf==='hello'){
      peers.add(m.who); paintPeers();
      if(mode==='host') pub('state', {i, shown});
    }
  });
  cli.subscribe([T('state'), T('vote'), T('hello')]);

  if(asHost){ go(1); pub('state',{i:1,shown:false}); }
  else { pub('hello',{who:me}); }
}

function pub(ch, obj){ if(cli) cli.publish(T(ch), JSON.stringify(obj)); }
function setDot(on){ document.getElementById('dot').classList.toggle('live', !!on); }
function paintPeers(){
  const n = peers.size + (mode==='host'?0:1);
  document.getElementById('peers').textContent = n ? ` · ${n}명` : '';
}

window.hostRoom = ()=> connect(rnd(6), true);
window.joinRoom = ()=>{
  const v = (document.getElementById('joincode').value||'').trim().toUpperCase();
  if(v.length!==6){ alert('코드 6자리를 넣어주세요.'); return; }
  connect(v, false);
};

function tallyOf(qi){
  const v = votes[qi] || {};
  const c = {}; let t = 0;
  for(const k in v){ c[v[k]] = (c[v[k]]||0)+1; t++; }
  return {c, t};
}
function paintTally(){
  if(mode==='solo' || i===0 || i===TOTAL-1) return;
  const {c,t} = tallyOf(i);
  stage.querySelectorAll('.opt').forEach((el,n)=>{
    let box = el.querySelector('.tally');
    if(!box){
      box = document.createElement('div');
      box.className='tally';
      box.innerHTML='<div class="tallybar"><i></i></div><div class="tallytxt"></div>';
      el.appendChild(box);
    }
    const k = c[n]||0;
    box.querySelector('i').style.width = (t ? k/t*100 : 0)+'%';
    box.querySelector('.tallytxt').textContent = t ? `${k}명 (${Math.round(k/t*100)}%)` : '아직 없음';
  });
}

/* ---------- 구동 ---------- */
let i = 0, shown = false, notes = false;
const TOTAL = Q.length + 2;
const stage = document.getElementById('stage');

function render(){
  shown = false;
  if(i === 0){ stage.innerHTML = COVER; }
  else if(i === TOTAL-1){ stage.innerHTML = OUTRO; }
  else {
    const q = Q[i-1];
    stage.innerHTML = `
      <div class="tag">${q.tag}</div>
      <h1>${q.q}</h1>
      ${q.sub ? `<p class="sub">${q.sub}</p>` : '<div style="height:12px"></div>'}
      <div class="opts ${q.trio?'trio':''}" id="opts">
        ${q.opts.map((o,n)=>`
          <div class="opt" data-n="${n}">
            <span class="mark">✓</span>
            <div class="lbl">${String.fromCharCode(65+n)}</div>
            ${o.svg}
            <div class="cap">${o.cap}</div>
          </div>`).join('')}
      </div>
      <div class="reveal" id="rev">
        <h3>${q.title}</h3>
        ${q.why.split('|').map(t=>`<p>${t.trim()}</p>`).join('')}
        <div class="note ${notes?'on':''}" id="note">${q.note}</div>
      </div>`;
    stage.querySelectorAll('.opt').forEach(el=>{
      el.onclick = ()=>{
        if(shown) return;
        stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked','voted'));
        el.classList.add(mode==='solo' ? 'picked' : 'voted');
        if(mode!=='solo'){
          myPick = +el.dataset.n;
          (votes[i] ||= {})[me] = myPick;
          pub('vote', {who:me, i, pick:myPick});
          paintTally();
        }
      };
    });
    if(mode==='guest'){
      const m = document.createElement('div');
      m.className = 'guestmsg';
      m.textContent = '답을 고르면 바로 반영됩니다. 화면은 진행자를 따라 넘어가요.';
      stage.appendChild(m);
    }
    paintTally();
  }
  document.getElementById('count').textContent =
    i===0 ? '표지' : (i===TOTAL-1 ? '정리' : `${i} / ${Q.length}`);
  document.getElementById('prog').style.width = (i/(TOTAL-1)*100)+'%';
  window.scrollTo(0,0);
}

function reveal(fromNet){
  if(i===0 || i===TOTAL-1 || shown) return;
  shown = true;
  const q = Q[i-1];
  stage.querySelectorAll('.opt').forEach((el,n)=>{
    el.classList.remove('picked');
    el.classList.add(n===q.ans ? 'right' : 'wrong');
  });
  document.getElementById('rev').classList.add('on');
  paintTally();
  if(mode==='host' && !fromNet) pub('state', {i, shown:true});
}

function go(n){
  i = Math.max(0, Math.min(TOTAL-1, n));
  myPick = null;
  if(mode==='solo') history.replaceState(null,'', i?('#'+i):'#');
  render();
  if(mode==='host') pub('state', {i, shown:false});
}
function next(){
  if(mode==='guest') return;           /* 화면 이동은 진행자만 */
  if(!shown && i>0 && i<TOTAL-1) reveal(); else go(i+1);
}

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = ()=>{ if(mode!=='guest') go(i-1); };
document.getElementById('noteBtn').onclick = ()=>{
  notes = !notes;
  const n = document.getElementById('note');
  if(n) n.classList.toggle('on', notes);
};
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') { next(); e.preventDefault(); }
  else if(e.key==='ArrowLeft') { if(mode!=='guest') go(i-1); }
  else if(e.key===' ') { if(mode!=='guest') reveal(); e.preventDefault(); }
  else if(e.key==='n'||e.key==='N') document.getElementById('noteBtn').click();
});

/* #3 → 3번 슬라이드, #3a → 정답까지 펼친 상태 */
const h = (location.hash||'').replace('#','');
if(h){
  i = Math.max(0, Math.min(TOTAL-1, parseInt(h,10)||0));
  render();
  if(/a$/.test(h)) reveal();
} else {
  render();
}
window.addEventListener('hashchange', ()=>{
  const v = (location.hash||'').replace('#','');
  i = Math.max(0, Math.min(TOTAL-1, parseInt(v,10)||0));
  render();
  if(/a$/.test(v)) reveal();
});
</script>
